name: Sync proxy nodes

on:
  schedule:
    # GitHub Actions uses UTC. This is 10:15 in Beijing (UTC+8).
    - cron: "15 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-nodes.yml"

permissions:
  contents: write

concurrency:
  group: sync-proxy-nodes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Discover and download upstream nodes
        shell: bash
        env:
          UPSTREAM_API: https://api.github.com/repos/bbq-051116/TG-iamdt009/contents
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request
          from pathlib import Path

          api_url = os.environ["UPSTREAM_API"]
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "lwhx-fklmnkk-node-sync",
          }
          proxy_pattern = re.compile(
              rb"(?m)^(?:anytls|hysteria2?|https?|juicity|naive|shadowtls|"
              rb"snell|socks5?|ss|ssr|trojan|tuic|vless|vmess|wireguard)://"
          )

          def download(url: str) -> bytes:
              parts = urllib.parse.urlsplit(url)
              encoded_url = urllib.parse.urlunsplit(
                  (
                      parts.scheme,
                      parts.netloc,
                      urllib.parse.quote(parts.path),
                      urllib.parse.quote(parts.query, safe="=&%"),
                      "",
                  )
              )
              request = urllib.request.Request(encoded_url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read()

          listing = json.loads(download(api_url))
          candidates = []

          for item in listing:
              if item.get("type") != "file":
                  continue
              if not item.get("download_url"):
                  continue
              if item.get("size", 0) > 5 * 1024 * 1024:
                  print(f"Skipping oversized file: {item.get('name')}")
                  continue

              try:
                  content = download(item["download_url"])
              except Exception as exc:
                  print(f"Could not read {item.get('name')}: {exc}", file=sys.stderr)
                  continue

              count = len(proxy_pattern.findall(content))
              print(f"Scanned {item.get('name')}: {count} proxy records")
              if count:
                  candidates.append((count, item.get("name", "unknown"), content))

          if not candidates:
              raise SystemExit("No upstream file contains proxy URLs; keeping existing 1.txt")

          count, name, content = max(candidates, key=lambda candidate: candidate[0])
          if count < 5:
              raise SystemExit(
                  f"Best candidate {name!r} has only {count} proxy records; "
                  "refusing to replace existing 1.txt"
              )

          Path("1.txt.new").write_bytes(content)
          print(f"Selected {name}: {count} proxy records")
          PY

          test -s 1.txt.new
          mv 1.txt.new 1.txt

      - name: Commit updated nodes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- 1.txt)" ]]; then
            echo "No upstream changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 1.txt
          git commit -m "chore: sync upstream nodes"
          git push
